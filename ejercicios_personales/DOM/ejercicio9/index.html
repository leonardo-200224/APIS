<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        main {
            display: flex;
            flex-direction: column;
            justify-content: center;
            width: 50%;
            margin: 1px auto;
            height: 100vh;
        }
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        li {
            padding: 1rem;
            border: 1px solid black;
            margin: 1rem;
            cursor: pointer;
        }

        li:hover {
            background-color: aliceblue;
        }
        
        .highlight {
            background-color: rgb(2, 176, 5);
            color: white;
        }
    </style>
</head>

<body>
    <main>
        <ul>
            <li>Option 1</li>
            <li>Option 2</li>
            <li>Option 3</li>
            <li>Option 4</li>
            <li>Option 5</li>
        </ul>
    </main>
    <script src="app.js"></script>
</body>
</html>
